<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
    <h1>Registro de la biblioteca</h1>
    <form action="#" class="Formulario">

    
        <fieldset>
            <legend> Datos Personales</legend>
            <div class="campo">
                <label for="Nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="campo">
                <label for="documento">Documento</label>
                <input type="text" name="Documento" id="documento" required>
            </div>
            <div class="campo">
                <label for="correo">Correo Eletronico</label>
                <input type="email" name="correo" id="correo" required>
            </div>
            <div class="campo">
                <label for="Nacimiento">nacimiento</label>
                <input type="date" name="nacimiento" id="nacimiento" min="1900-01-01" required>
            </div>
            
            <div class="campo">
                <label for="cleve">Contraseña</label>
                <input type="password" name="clave" id="clave" required minlength="8">
            </div>
            <div class="campo">
                <label for="Edad">Edad</label>
                <input type="number" name="edad" id="edad" min="0" max="120" required>
            </div>
        </fieldset>

        <fieldset> 
            <legend> Tu perfil</legend>
            <div class="campo">
                <label for="tipo">Tipo de Usuario</label>
                <select name="tipo" id="tipo" required>
                    <option value="">Elige una opción</option>
                    <option value="Aprendiz">Aprendiz</option>
                    <option value="Intructor"> Intructor</option>
                    <option value="Visitante">Visitante</option>
                </select>
                
            </div>
        </fieldset class="grupo">
        <legend> Sede</legend>
        <label for="Norte" class="opcion">
        <input type="radio" name="sede" id="norte" checked>Norte
    </label>
    <label for="centro" class="opcion">
        <input type="radio" name="sede" id="centro" value="centro">centro
    </label>
    <label for="sur" class="opcion">
        <input type="radio" name="sede" id="sur" value="sur">sur
    </label>
</fieldset>
<fieldset class="grupo">
    <legend>Temas que te interesan</legend>
</fieldset>

    <label from="" class="opcion">
        <input type="checkbox" name="temas" id="novelas" value="novelas">Novelas
    </label>
</fieldset>
    <label from="" class="opcion">
        <input type="checkbox" name="temas" id="ciencia" value="ciencia">ciencia
    </label>
</fieldset>
    <label from="" class="opcion">
        <input type="checkbox" name="temas" id=" tecologia" value="tecnologia">Tecnologia
    </label>
</fieldset>
<div class="campo">
    <label for="comentario">¿Que libro te gustaria que tuvieramos?</label>
    <textarea name="comentario" id="comentario"
    rows="4"></textarea>
</div>
</fieldset>
<button type="submit" class="boton">Registrarme</button>
    </form>
    </main>
</body>
</html>
