<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi tarjeta de perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body>

    <main class="tarjeta">
        <img src="img/cheelsea.jpeg" 
        alt="foto cheelsea"
         width="100">

        <h1>Mi perfil</h1>
        <h1 id="nombre">Cheelsea Faria Moreno</h1>
        <p class="descripcion">
            Soy estudiante de ADSO y estoy aprendiendo
            desarrollo de software.
        </p>

        <h2>Mis habilidades</h2>

        <div class="habilidades">
            <span class="etiqueta">HTML</span>
            <span class="etiqueta">CSS</span>
            <span class="etiqueta">JavaScript</span>
            <span class="etiqueta">Python</span>
        </div>

        <button id="btnTema" class="boton"
                onclick="cambiarModo()">
            Cambiar modo
        </button>
    </main>
     
</main>
<script>
function cambiarModo() {
            document.body.classList.toggle("oscuro");
}
</script>

</body>
</html>
